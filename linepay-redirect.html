<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前往付款</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding-top: 3rem;
    color: #333;
  }
  a.fallback {
    display: none;
    margin-top: 1rem;
    color: #06C755;
    font-weight: bold;
  }
</style>
</head>
<body>
  <!-- 跟 liff-redirect/index.html 一樣，這裡要填入你自己的 LIFF ID -->
  <p id="msg">正在為您導向付款頁面...</p>
  <a id="fallback-link" class="fallback" href="#">若沒有自動跳轉，請點此前往付款</a>

  <script>
    // ↓↓↓ 跟 liff-redirect/index.html 用同一組 LIFF_ID，改成你自己的 ↓↓↓
    var LIFF_ID = "2011607654-OAHnsnbi";

    var params = new URLSearchParams(window.location.search);
    var targetUrl = params.get("url");
    var msgEl = document.getElementById("msg");
    var fallbackEl = document.getElementById("fallback-link");

    function showFallback(text) {
      msgEl.textContent = text || "請點下方連結前往付款：";
      fallbackEl.href = targetUrl;
      fallbackEl.style.display = "inline-block";
    }

    if (!targetUrl) {
      msgEl.textContent = "缺少付款網址參數，請從商店頁面重新結帳。";
    } else {
      liff.init({ liffId: LIFF_ID }).then(function () {
        // 這裡必須是最外層頁面（不能被包在 iframe 裡），
        // liff.openWindow 的 external:true 才能正確跳出到手機系統瀏覽器。
        liff.openWindow({ url: targetUrl, external: true });
        // openWindow 呼叫後畫面通常還會留在這裡，順便顯示備用連結，
        // 避免使用者的裝置沒有自動跳轉時卡住不知道要做什麼。
        showFallback();
      }).catch(function () {
        // 不是在 LINE 環境裡打開（例如直接用一般瀏覽器測試），
        // 沒有 LIFF 橋接可用，直接同頁跳轉即可。
        window.location.href = targetUrl;
      });
    }
  </script>
</body>
</html>

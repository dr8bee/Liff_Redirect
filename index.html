<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>載入中…</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{
    margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"Noto Sans TC",sans-serif; background:#1C130B; color:#F3E9D6;
  }
  p{font-size:.9rem; opacity:.8;}
</style>
</head>
<body>
<p id="msg">連接中…</p>
<script>
  // ---------------------------------------------------------------------
  // 這個頁面是 LIFF App 在 LINE Developers 後台設定的「Endpoint URL」。
  // 它唯一的工作：跟 LINE 完成登入、拿到 id_token，然後把使用者導到
  // Streamlit 網頁（把 id_token 帶在網址上），Streamlit 後端會再驗證這個
  // id_token 一次，確認身分後才建立訂單。
  //
  // 部署方式：把這個資料夾（liff-redirect/）放到 GitHub Pages，
  // 例如 repo 設定 Pages 後網址會是
  //   https://<你的帳號>.github.io/<repo>/liff-redirect/
  // 再到 LINE Developers > LIFF > Endpoint URL 填這個網址。
  // ---------------------------------------------------------------------

  const LIFF_ID = "2011607654-OAHnsnbi";                 // ← 換成你的 LIFF ID，外顯也影響較小的資訊
  const STREAMLIT_APP_URL = "https://rich-menus.streamlit.app/"; // ← 換成你的 Streamlit 網址

  async function main(){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){
        liff.login({ redirectUri: window.location.href });
        return;
      }
      
      const idToken = liff.getIDToken();
      const url = new URL(STREAMLIT_APP_URL);
      if(idToken) url.searchParams.set("id_token", idToken);
      window.location.replace(url.toString());
    }catch(err){
      //document.getElementById('msg').textContent = "連接失敗，請關閉重新從選單開啟一次。";
      document.getElementById('msg').textContent = "錯誤: " + err.message;
      console.error(err);
    }
  }
  main();
</script>
</body>
</html>
